<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국시간 시계</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #101418;
      color: #f6f7f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(35, 118, 201, 0.22), transparent 34%),
        linear-gradient(135deg, #101418 0%, #18222c 100%);
    }

    .clock {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(16, 20, 24, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .clock__label {
      margin: 0 0 12px;
      color: #9fb0c1;
      font-size: 16px;
      letter-spacing: 0;
    }

    .clock__time {
      margin: 0;
      font-size: clamp(48px, 12vw, 88px);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .clock__date {
      margin: 18px 0 0;
      color: #d8e0e8;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 600;
    }

    .clock__zone {
      margin: 16px 0 0;
      color: #8fa1b3;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="clock" aria-live="polite">
    <p class="clock__label">현재 한국시간</p>
    <h1 class="clock__time" id="time">--:--:--</h1>
    <p class="clock__date" id="date">날짜를 불러오는 중</p>
    <p class="clock__zone">KST · UTC+09:00</p>
  </main>

  <script>
    const timeElement = document.getElementById("time");
    const dateElement = document.getElementById("date");

    const timeFormatter = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });

    function updateClock() {
      const now = new Date();
      timeElement.textContent = timeFormatter.format(now);
      dateElement.textContent = dateFormatter.format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
