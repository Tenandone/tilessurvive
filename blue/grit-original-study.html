    function setRate(rate) {
      speechRate = rate;
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
    }

    function cleanText(text) {
      return text.replace(/\s+/g, " ").trim();
    }

    function speak(button) {
      const box = button.closest(".sentence-box");
      const text = cleanText(box.querySelector(".sentence").innerText);

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = speechRate;
      utterance.pitch = 1;

      window.speechSynthesis.speak(utterance);
    }

    function speakAll() {
      window.speechSynthesis.cancel();

      const texts = allTexts.slice();
      let index = 0;

      function next() {
        if (index >= texts.length) return;

        const utterance = new SpeechSynthesisUtterance(texts[index]);
        utterance.lang = "en-US";
        utterance.rate = speechRate;
        utterance.pitch = 1;
        utterance.onend = next;

        index++;
        window.speechSynthesis.speak(utterance);
      }

      next();
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function highlightWords(text) {
      let escaped = escapeHtml(text);

      const keys = Object.keys(glossary).sort((a, b) => b.length - a.length);

      keys.forEach((key) => {
        const safeKey = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp("\\b" + safeKey + "\\b", "gi");

        escaped = escaped.replace(regex, (match) => {
          return `<span class="word" data-meaning="${glossary[key]}">${match}</span>`;
        });
      });

      return escaped;
    }

    function render() {
      const root = document.getElementById("script");
      let html = "";

      sections.forEach((section) => {
        html += `
          <div class="section-title">
            <h2>${section.title}</h2>
            <p>${section.range}</p>
          </div>
        `;

        section.lines.forEach(([time, en, ko]) => {
          allTexts.push(en);

          html += `
            <div class="sentence-box">
              <div class="sentence-row">
                <span class="time">${time}</span>
                <p class="sentence">${highlightWords(en)}</p>
                <button class="speak-btn" onclick="speak(this)">🔊</button>
              </div>
              <div class="meaning">${ko}</div>
            </div>
          `;
        });
      });

      root.innerHTML = html;
    }

    render();
  </script>
